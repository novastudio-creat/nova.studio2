<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Studio — PayPal</title><style>body{font-family:Arial;background:#fff8f6;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:30px;border-radius:24px;box-shadow:0 20px 60px #7a29481c;text-align:center}a{display:inline-block;margin-top:18px;padding:12px 18px;background:#7a2948;color:#fff;border-radius:12px;text-decoration:none}</style></head><body><div class="box"><h1>Completing your payment…</h1><p id="m">Please wait.</p><a href="/">Back to Nova Studio</a></div><script>const q=new URLSearchParams(location.search),orderId=q.get('order_id'),paypalOrderId=q.get('token');fetch('/api/paypal-capture-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId,paypalOrderId})}).then(r=>r.json()).then(x=>{document.getElementById('m').textContent=x.status==='paid'?'Payment confirmed ✦ Your order #'+x.orderNumber+' is recorded.':'Payment is still pending. Please contact Nova Studio.'}).catch(()=>document.getElementById('m').textContent='We could not confirm the PayPal payment automatically. Please contact Nova Studio.');</script></body></html>
