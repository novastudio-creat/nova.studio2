<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Studio — Order Confirmation</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff8f6;color:#241b20;display:grid;place-items:center;min-height:100vh;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #ead7dc;border-radius:28px;padding:34px;box-shadow:0 24px 70px #7a29481f}h1{font-family:Georgia,serif;color:#7a2948;font-size:38px;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:.16em;color:#9a7180;font-weight:800}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #eee1e5}.total{font-size:20px;font-weight:900;color:#7a2948}.btn{display:block;text-align:center;text-decoration:none;background:#7a2948;color:white;padding:14px 18px;border-radius:14px;margin-top:20px;font-weight:800}.muted{color:#766a70;line-height:1.6}</style></head><body><main class="card"><div class="eyebrow">NOVA STUDIO / ORDER CONFIRMATION</div><h1 id="title">Thank you ✦</h1><p class="muted" id="msg">We are confirming your payment…</p><div id="order"></div><a class="btn" href="/">Back to Nova Studio</a></main><script>const q=new URLSearchParams(location.search);const session=q.get('session_id');fetch('/api/get-order?session_id='+encodeURIComponent(session||'')).then(r=>r.json()).then(x=>{if(!x.order)throw new Error(x.error||'Order not found');const o=x.order;document.getElementById('msg').textContent=o.payment_status==='paid'?'Your payment was confirmed. Your order is safely recorded.':'Your order was received and is being verified.';document.getElementById('order').innerHTML='<div class="row"><span>Order</span><b>#'+o.order_number+'</b></div><div class="row"><span>Name</span><b>'+esc(o.customer_name)+'</b></div><div class="row"><span>Email</span><b>'+esc(o.customer_email)+'</b></div><div class="row"><span>Product</span><b>'+esc(o.product_name)+'</b></div><div class="row"><span>Payment</span><b>'+esc(o.payment_method)+'</b></div><div class="row total"><span>Total</span><span>'+money(o.amount,o.currency)+'</span></div>'}).catch(e=>{document.getElementById('msg').textContent=e.message||'We could not load the order yet. Please check your email or contact Nova Studio.'});function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function money(n,c){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:String(c).toUpperCase(),currencyDisplay:String(c).toUpperCase()==='DZD'?'code':'symbol',maximumFractionDigits:String(c).toUpperCase()==='DZD'?0:2}).format(Number(n))}catch{return Number(n).toFixed(2)+' '+String(c).toUpperCase()}}</script></body></html>
